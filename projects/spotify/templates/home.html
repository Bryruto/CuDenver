<!DOCTYPE html>
<html>
    <head>
        <title>Playlist</title>
    </head>
    <body>
        <p>
            how to use this playlist maker go to <a href = "https://exportify.net/">exportify</a> download that csv of your liked song
            import that csv to the input below
        </p>
        <form action = "/" method="POST" enctype="multipart/form-data">
            <p>INPUT CSV</p>
            <input type = "file" name = "csv" accept = ".csv" >
            <button type = "submit" >Get playlist</button>
        </form>
        <table>
            <h2> ROCK</h2>
            <thead>
                <tr>
                <th>song</th>
                <th>artist</th>
                </tr>
            </thead>
            <tbody>
                {% for row in rock %}
                <tr>
                    <td>{{row["song"]}}</td>
                    <td>{{row["artist"]}}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>


    </body>
</html>
